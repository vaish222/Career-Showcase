kind = "web"
previewPath = "/"
title = "Portfolio"
description = "A personal portfolio website for a Senior Software Engineer pivoting to Product Management. Features a dark charcoal/slate theme with all eight sections: Hero, About, Projects, Skills, Work Experience, Education, Blog, and Contact. All content is static and defined in a data file."
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
